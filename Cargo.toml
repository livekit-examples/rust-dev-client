[package]
name = "rust-dev-client"
description = "LiveKit Developer Client"
version = "0.1.0"
edition = "2024"

[dependencies]
eframe = { version = "0.36.1", features = ["default_fonts", "wgpu", "persistence"] }
egui = "0.36.1"
egui-wgpu = "0.36.1"
env_logger = "0.11"
futures = "0.3"
image = "0.25"
log = "0.4"
parking_lot = { version = "0.12", features = ["deadlock_detection"] }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["full", "parking_lot"] }
# egui-wgpu 0.36 requires wgpu ^30.0; "30.0" resolves to a compatible 30.0.x.
wgpu = "30.0"
winit = { version = "0.30.13", features = [ "android-native-activity" ] }
livekit = { version = "0.8.3", features = ["rustls-tls-native-roots"] }
livekit-api = { version = "0.6.3", default-features = false, features = ["access-token"] }
livekit-token-source = { version = "0.1.1", features = ["rustls-tls-native-roots"] }

# Building against a local rust-sdks checkout (see "Building against a local
# rust-sdks" in README.md). To build against the released crates instead,
# uncomment out the three lines below and comment the ones above:
# livekit = { path = "../rust-sdks/livekit", features = ["rustls-tls-native-roots"] }
# livekit-api = { path = "../rust-sdks/livekit-api", default-features = false, features = ["access-token"] }
# livekit-token-source = { path = "../rust-sdks/livekit-token-source", features = ["rustls-tls-native-roots"] }

[package.metadata.bundle]
name = "LiveKit Client"
identifier = "io.livekit.rust-dev-client"
copyright = "2026 LiveKit, Inc."
category = "public.app-category.developer-tools"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "debuginfo"
panic = "abort"