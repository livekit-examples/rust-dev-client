version: 2
updates:
  - package-ecosystem: rust-toolchain
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      livekit-crates:
        patterns:
          - livekit-*
        update-types:
          - minor
          - patch
      egui-crates:
        patterns:
          - eframe
          - egui
          - egui-wgpu
          - wgpu
        update-types:
          - minor
          - patch
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
